<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clothing AI Uploader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: rgb(0, 213, 255);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 10px;
      font-size: 2.5rem;
    }

    .subtitle {
      color: white;
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.2rem;
    }

    .subtitle1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 1.2rem;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .card h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    input[type="file"] {
      display: block;
      width: 100%;
      padding: 12px;
      border: 2px dashed #667eea;
      border-radius: 8px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }

    input[type="file"]:hover {
      border-color: #764ba2;
      background: #f8f9ff;
    }

    .preview-container {
      width: 100%;
      max-height: 400px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
      overflow: hidden;
    }

    #imagePreview {
      display: none;
      max-width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: rgb(200, 97, 255);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9ff;
      border-radius: 8px;
      border-left: 4px solid #667eea;
      min-height: 50px;
      display: none;
      text-align: left;
    }

    .status.show {
      display: block;
    }

    .status strong {
      color: #667eea;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      text-align: left;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .error {
      background: #fee;
      border-left-color: #f44;
      color: #c00;
    }

    .success {
      background: #efe;
      border-left-color: #4c4;
      color: #060;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 0.85rem;
      margin-top: 8px;
    }

    /* --- Auth styles --- */
    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      background: #f0f0f5;
      color: #555;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }

    .auth-tab.active {
      background: #f0e9ff;
      color: rgb(140, 60, 220);
      border-color: rgb(200, 97, 255);
    }

    .auth-form {
      display: none;
      text-align: left;
    }

    .auth-form.active {
      display: block;
    }

    .session-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: #f0fff4;
      border-left: 4px solid #4c4;
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 20px;
      color: #060;
      font-size: 0.95rem;
    }

    .session-bar.show {
      display: flex;
    }

    .session-bar button {
      width: auto;
      padding: 8px 16px;
      font-size: 0.85rem;
      background: #444;
    }

    .locked {
      opacity: 0.5;
      pointer-events: none;
      user-select: none;
    }

    .auth-status {
      margin-top: 14px;
      font-size: 0.9rem;
      text-align: left;
      display: none;
    }

    .auth-status.show {
      display: block;
    }
  </style>
  <!-- Supabase JS client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <h1>Find Similar Clothing</h1>
    <p class="subtitle">A tool to help you find similar</p>
    <p class="subtitle1">clothes sold in the Ebay market!</p>

    <!-- Signed-in banner -->
    <div id="sessionBar" class="session-bar">
      <span id="sessionEmail"></span>
      <button id="logoutBtn" type="button">Log out</button>
    </div>

    <!-- Auth Section (shown when logged out) -->
    <div class="card" id="authCard">
      <h2>Sign in to continue</h2>
      <div class="auth-tabs">
        <div class="auth-tab active" id="loginTab">Log In</div>
        <div class="auth-tab" id="signupTab">Sign Up</div>
      </div>

      <!-- Login form -->
      <form id="loginForm" class="auth-form active">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <button type="submit" id="loginBtn">Log In</button>
      </form>

      <!-- Sign-up form -->
      <form id="signupForm" class="auth-form">
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="At least 6 characters" minlength="6" required />
        </div>
        <button type="submit" id="signupBtn">Sign Up</button>
      </form>

      <div id="authStatus" class="auth-status status"></div>
    </div>

    <!-- Image Upload Section -->
    <div class="card" id="uploadCard">
      <h2>1. Upload Clothing Image</h2>
      <input type="file" id="imageUpload" accept="image/*" />
      <div class="preview-container">
        <img id="imagePreview" alt="Image preview" />
      </div>
    </div>

    <!-- Size + Price Form -->
    <div class="card" id="submitCard">
      <h2>2. Enter Size and Price</h2>
      <form id="uploadForm">
        <div class="form-group">
          <label for="size">Size</label>
          <input type="text" id="size" placeholder="e.g. XS, S, M, L, XL" required />
        </div>

        <div class="form-group">
          <label for="price">Price ($)</label>
          <input type="number" id="price" step="0.01" min="0" placeholder="e.g. 49.99" required />
        </div>

        <button type="submit" id="submitBtn">Submit</button>
      </form>
      <div id="submissionStatus" class="status"></div>
    </div>
  </div>

  <script>
    // --- Supabase setup ---
    // Replace these with your project's values (Project Settings → API in the Supabase dashboard).
    // The anon/public key is safe to expose in frontend code — it relies on your Row Level Security
    // policies to actually restrict access, so make sure those are set up on the backend.
    const SUPABASE_URL = "https://wytzqccveecanenvedvb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5dHpxY2N2ZWVjYW5lbnZlZHZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2OTE4NTUsImV4cCI6MjA5ODI2Nzg1NX0.FhD8FOzbz5Hfz2MfLSthwtNohsctZLWZMoQQAm2C-UE";

    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- Auth elements ---
    const authCard = document.getElementById("authCard");
    const uploadCard = document.getElementById("uploadCard");
    const submitCard = document.getElementById("submitCard");
    const sessionBar = document.getElementById("sessionBar");
    const sessionEmail = document.getElementById("sessionEmail");
    const logoutBtn = document.getElementById("logoutBtn");

    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const loginBtn = document.getElementById("loginBtn");
    const signupBtn = document.getElementById("signupBtn");
    const authStatus = document.getElementById("authStatus");

    let currentSession = null;

    function showAuthStatus(message, isError) {
      authStatus.textContent = message;
      authStatus.classList.add("show");
      authStatus.classList.toggle("error", !!isError);
      authStatus.classList.toggle("success", !isError);
    }

    // Toggle between Log In / Sign Up tabs
    loginTab.addEventListener("click", () => {
      loginTab.classList.add("active");
      signupTab.classList.remove("active");
      loginForm.classList.add("active");
      signupForm.classList.remove("active");
      authStatus.classList.remove("show");
    });

    signupTab.addEventListener("click", () => {
      signupTab.classList.add("active");
      loginTab.classList.remove("active");
      signupForm.classList.add("active");
      loginForm.classList.remove("active");
      authStatus.classList.remove("show");
    });

    // Reflect the current session in the UI: lock/unlock the upload cards,
    // show/hide the auth card, and show who's logged in.
    function renderSessionState(session) {
      currentSession = session;

      if (session) {
        authCard.style.display = "none";
        sessionBar.classList.add("show");
        sessionEmail.textContent = `Signed in as ${session.user.email} (id: ${session.user.id})`;
        uploadCard.classList.remove("locked");
        submitCard.classList.remove("locked");
      } else {
        authCard.style.display = "block";
        sessionBar.classList.remove("show");
        uploadCard.classList.add("locked");
        submitCard.classList.add("locked");
      }
    }

    // Sign up with email + password
    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      signupBtn.disabled = true;
      const email = document.getElementById("signupEmail").value;
      const password = document.getElementById("signupPassword").value;

      const { data, error } = await sb.auth.signUp({ email, password });

      signupBtn.disabled = false;

      if (error) {
        showAuthStatus(error.message, true);
        return;
      }

      if (!data.session) {
        // Email confirmation is likely required before a session is issued
        showAuthStatus("Account created! Check your email to confirm before logging in.", false);
      } else {
        showAuthStatus("Account created and signed in!", false);
        renderSessionState(data.session);
      }
    });

    // Log in with email + password
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginBtn.disabled = true;
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      loginBtn.disabled = false;

      if (error) {
        showAuthStatus(error.message, true);
        return;
      }

      renderSessionState(data.session);
    });

    // Log out
    logoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      renderSessionState(null);
    });

    // Keep UI in sync with token refreshes, expiry, sign-in/out from other tabs, etc.
    sb.auth.onAuthStateChange((_event, session) => {
      renderSessionState(session);
    });

    // On load, check for an existing session (e.g. after a page refresh)
    (async () => {
      const { data } = await sb.auth.getSession();
      renderSessionState(data.session);
    })();

    const imageUpload = document.getElementById("imageUpload");
    const imagePreview = document.getElementById("imagePreview");
    const uploadForm = document.getElementById("uploadForm");
    const submissionStatus = document.getElementById("submissionStatus");
    const submitBtn = document.getElementById("submitBtn");

    // Handle image preview
    imageUpload.addEventListener("change", () => {
      const file = imageUpload.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        imagePreview.src = reader.result;
        imagePreview.style.display = "block";
      };
      reader.readAsDataURL(file);

      submissionStatus.classList.remove("show", "error", "success");
    });

    // Handle form submission — sends file, size, and price to /predict
    uploadForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!currentSession) {
        alert("Please log in first.");
        return;
      }

      const file = imageUpload.files[0];
      if (!file) {
        alert("Please upload a clothing image first.");
        return;
      }

      const size = document.getElementById("size").value;
      const price = document.getElementById("price").value;

      // FastAPI /predict expects three multipart form fields:
      //   - file: UploadFile
      //   - size: str
      //   - price: float
      const formData = new FormData();
      formData.append("file", file);
      formData.append("size", size);
      formData.append("price", price);

      submitBtn.disabled = true;
      submissionStatus.innerHTML = "Giving you magic...";
      submissionStatus.classList.add("show");
      submissionStatus.classList.remove("error", "success");

      try {
        // Pull the freshest session (the client auto-refreshes the token in the
        // background, so re-fetching here avoids sending a stale/expired one).
        const { data: { session } } = await sb.auth.getSession();
        if (!session) {
          throw new Error("Your session expired. Please log in again.");
        }

        const res = await fetch("http://localhost:8000/upload", {
          method: "POST",
          headers: {
            Authorization: `Bearer ${session.access_token}`
          },
          body: formData
        });

        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`HTTP ${res.status}: ${errText}`);
        }

        const result = await res.json();

        submissionStatus.innerHTML = `
          <strong>Received by backend</strong><br><br>
          <pre>${JSON.stringify(result, null, 2)}</pre>
        `;
        submissionStatus.classList.add("success");
      } catch (err) {
        console.error("Submission error:", err);
        submissionStatus.innerHTML = `<strong>Error submitting form</strong><br><small>${err.message}</small>`;
        submissionStatus.classList.add("error");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
