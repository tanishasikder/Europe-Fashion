<!-- templates/info.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothes</title>
</head>
<body>

    <h1>Clothing Items</h1>

    {% if clothes %}
        <div>
            {% for item in clothes %}
                <div>
                    <h2>{{ item.name }}</h2>

                    <p>
                        Category: {{ item.category }}
                    </p>

                    {% if item.description %}
                        <p>{{ item.description }}</p>
                    {% endif %}
                </div>
                <hr>
            {% endfor %}
        </div>
    {% else %}
        <p>No clothing items found.</p>
    {% endif %}

    <a href="/clothes/add">Add Clothes</a>

</body>
</html>
